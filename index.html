<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alur Kerja Lensiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#6B6B6B;
  --grey:#BDBDBD; --grey-text:#9A9A9A; --grey-fill:#FFFFFF;
  --accent:#000000; --accent-soft:#F2F2F2;
  --good:#1E8E4E; --bad:#D0342C; --wait:#E08A00; --notif:#2F6FDB; --flow:#000000;
  --tip-bg:#000000; --tip-ink:#FFFFFF;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0}
.wrap{height:100%;display:flex;flex-direction:column}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:900px){.wrap{height:auto}.layout{grid-template-columns:1fr}.board svg{height:auto}}
header{padding:14px 20px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px}
h1{font:700 24px/1.1 var(--display);margin:0}
h1 small{display:block;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hint{color:var(--muted);font-size:14px;margin:0}
.board{position:relative;background:var(--surface);overflow:auto;min-height:0}
.board svg{display:block;min-width:720px;width:100%;height:100%}

/* Kotak: default abu-abu */
.n{cursor:pointer;outline:none}
.n rect,.n ellipse,.n polygon{fill:var(--grey-fill);stroke:var(--grey);stroke-width:1.4;transition:fill .15s,stroke .15s}
.n text{fill:var(--grey-text);font:600 12.5px var(--body);text-anchor:middle;dominant-baseline:middle;letter-spacing:.02em;pointer-events:none;transition:fill .15s}

/* Garis berwarna sesuai arti */
.e{fill:none;stroke:var(--grey);stroke-width:1.8;marker-end:url(#a-grey);transition:opacity .15s,stroke-width .15s,stroke .15s}
.e.on{stroke:var(--c);marker-end:url(#a-flow)}
.e,.lbl{--c:var(--flow)}
.yes{--c:var(--good)} .no{--c:var(--bad)} .wait{--c:var(--wait)} .notif{--c:var(--notif)}
.e.on.yes{marker-end:url(#a-yes)} .e.on.no{marker-end:url(#a-no)} .e.on.wait{marker-end:url(#a-wait)} .e.on.notif{marker-end:url(#a-notif)}
.e.on.no,.e.on.wait{stroke-dasharray:6 4}
.lbl{fill:var(--grey-text);font:700 11.5px var(--body);letter-spacing:.06em;transition:opacity .15s,fill .15s}
.lbl.on{fill:var(--c)}

/* Aktif (hover / klik) */
.n.on rect,.n.on ellipse,.n.on polygon{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.n.on text{fill:var(--ink)}
.n.near rect,.n.near ellipse,.n.near polygon{stroke:var(--accent)}
.n.near text{fill:var(--ink)}
.n:focus-visible rect,.n:focus-visible ellipse,.n:focus-visible polygon{stroke:var(--accent);stroke-width:2.5}
.focus .e:not(.on),.focus .lbl:not(.on){opacity:.18}
.e.on{
  stroke-width:3;
  stroke-dasharray:8 6;
  animation: flowArrow 0.6s linear infinite;
}
.e.on.no,.e.on.wait{
  stroke-dasharray:6 4;
  animation: flowArrowDash 0.5s linear infinite;
}

@keyframes flowArrow {
  from {
    stroke-dashoffset: 28;
  }
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes flowArrowDash {
  from {
    stroke-dashoffset: 20;
  }
  to {
    stroke-dashoffset: 0;
  }
}

.side{overflow:auto;border-left:1px solid #E0E0E0;padding:18px;display:flex;flex-direction:column;gap:18px}
.side h2{font:700 20px/1.2 var(--display);margin:0}
.side .eyebrow{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.side p{margin:0}
.desc{font-size:15px;line-height:1.55}
.empty{color:var(--muted)}
.conn{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.conn h3{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.conn div{display:flex;align-items:center;gap:8px;font-size:14px}
.conn i,.legend i{flex:none;display:inline-block;width:22px;height:0;border-top:3px solid var(--c)}
.conn i.dash,.legend i.dash{border-top-style:dashed}
.conn em{font-style:normal;font:700 11px var(--body);letter-spacing:.06em;color:var(--c)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);border-top:1px solid #E0E0E0;padding-top:14px}
.legend span{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){.n *,.e,.lbl{transition:none}}
</style>

<div class="wrap">
<header>
  <h1><small>Optik Lensiro</small>Alur Kerja Pesanan</h1>
  <p class="hint">Arahkan kursor atau klik salah satu langkah untuk melihat penjelasan dan alurnya.</p>
</header>

<div class="layout">
<div class="board" id="board">

    <path class="e" data-f="pb" data-t="ms" data-l="l-dikirim" d="M870,190 H1050 V298"/>
    <path class="e yes" data-f="sa" data-t="ms" data-l="l-ada" d="M860,330 H973"/>
    <path class="e" data-f="ms" data-t="dt" d="M1125,330 H1173"/>
    <path class="e" data-f="dt" data-t="bf" d="M1250,360 V433"/>
    <path class="e" data-f="bf" data-t="qa" d="M1175,465 H1107"/>

    <path class="e yes" data-f="ll" data-t="uf" data-l="l-lulus" d="M732,465 H657"/>

  </g>

  <g id="nodes">

    <g class="n" id="uf"><rect x="505" y="433" width="150" height="64"/><text x="580" y="448">UPDATE</text><text x="580" y="465">FASET</text><text x="580" y="482">BERHASIL</text></g>
    <g class="n" id="wa"><rect x="295" y="438" width="130" height="54"/><text x="360" y="457">FITUR WA</text><text x="360" y="474">EMAIL</text></g>

    <g class="n" id="ku"><rect x="320" y="571" width="120" height="48"/><text x="380" y="587">KUITANSI</text><text x="380" y="604">PEMBAYARAN</text></g>

</div>
<aside class="side" aria-live="polite">
  <div id="info"></div>
  <div class="legend">
    <span><i class="yes"></i>Berhasil / lanjut</span>
    <span><i class="no dash"></i>Gagal / ulangi</span>
    <span><i class="wait dash"></i>Menunggu (stok kosong, belum lunas)</span>
    <span><i class="notif"></i>Notifikasi ke customer</span>
    <span><i></i>Alur biasa</span>
  </div>
</aside>
</div>
</div>

<script>
const INFO={
  kasir:["Kasir","Kasir menerima pesanan kacamata dari customer."],
  po:["Penjualan Order","Kasir mencatat order: data customer, resep, lensa, dan frame."],
  ps:["Permintaan Stok","Order membuat permintaan stok lensa ke gudang."],
  ag:["Admin Gudang","Admin gudang memeriksa permintaan stok yang masuk."],
  ap:["Approved","Admin gudang menyetujui permintaan stok."],
  sa:["Stok Ada?","Ada: lanjut ke mutasi stok. Kosong: buat pembelian order ke supplier."],
  pb:["Pembelian Order","Stok kosong, gudang memesan ke supplier. Setelah barang dikirim, lanjut ke mutasi stok."],
  ms:["Mutasi Stok","Lensa dipindahkan dari gudang ke toko."],
  dt:["Diterima","Toko mengonfirmasi lensa sudah diterima."],
  bf:["Buat Faset","Lensa dipotong dan dipasang ke frame."],
  qa:["Buat QA","Hasil faset diperiksa: kekuatan lensa, axis, PD, dan kerapian."],
  ll:["Lulus?","Lulus: faset berhasil. Gagal: ulangi buat faset."],
  uf:["Update Faset Berhasil","Status faset diperbarui, lalu customer diberi notifikasi dan diarahkan ke pembayaran."],
  wa:["Fitur WA / Email","Notifikasi, kuitansi, dan invoice dikirim ke customer lewat WhatsApp dan email."],
  cu:["Customer","Customer menerima semua notifikasi dari toko."],
  py:["Pembayaran","Customer melakukan pembayaran."],
  ku:["Kuitansi Pembayaran","Setiap pembayaran menghasilkan kuitansi yang dikirim ke customer."],
  ln:["Lunas?","Belum lunas: kembali ke pembayaran. Lunas: barang bisa diambil."],
  ab:["Ambil Barang","Customer mengambil kacamata di toko."],
  is:["Invoice / Struk","Invoice atau struk dibuat dan dikirim ke customer."]
};
const board=document.getElementById("board"),info=document.getElementById("info");
const DEFAULT='<p class="eyebrow">Penjelasan</p><h2>Pilih langkah</h2><p class="desc empty" style="margin-top:6px">Arahkan kursor atau klik salah satu kotak di diagram. Penjelasan dan alurnya muncul di sini.</p>';
const nodes=[...document.querySelectorAll(".n")],edges=[...document.querySelectorAll(".e")];
let pinned=null;

function clear(){
  document.querySelectorAll(".on,.near").forEach(el=>el.classList.remove("on","near"));
  board.classList.remove("focus");
  info.innerHTML=DEFAULT;
}
function show(n){
  clear();
  n.classList.add("on");
  board.classList.add("focus");
  edges.forEach(e=>{
    if(e.dataset.f!==n.id&&e.dataset.t!==n.id)return;
    if("fromOnly" in e.dataset&&e.dataset.f!==n.id)return;
    e.classList.add("on");
    (e.dataset.l||"").split(" ").filter(Boolean).forEach(id=>document.getElementById(id).classList.add("on"));
    const other=e.dataset.f===n.id?e.dataset.t:e.dataset.f;
    if(other!==n.id)document.getElementById(other).classList.add("near");
  });
  const [t,d]=INFO[n.id];
  const kind=e=>["yes","no","wait","notif"].find(k=>e.classList.contains(k))||"";
  const row=(e,other)=>{const k=kind(e),lbl=(e.dataset.l||"").split(" ").filter(Boolean).map(id=>document.getElementById(id).textContent).join(" / ");
    return `<div class="${k}"><i class="${k==="no"||k==="wait"?"dash":""}"></i>${INFO[other][0]}${lbl?` <em>${lbl}</em>`:""}</div>`;};
  const vis=edges.filter(e=>(e.dataset.f===n.id||e.dataset.t===n.id)&&!("fromOnly" in e.dataset&&e.dataset.f!==n.id));
  const inn=vis.filter(e=>e.dataset.t===n.id).map(e=>row(e,e.dataset.f)).join("");
  const out=vis.filter(e=>e.dataset.f===n.id).map(e=>row(e,e.dataset.t)).join("");
  info.innerHTML=`<p class="eyebrow">Langkah</p><h2>${t}</h2><p class="desc" style="margin-top:6px">${d}</p>
    <div class="conn">${inn?`<h3>Dari</h3>${inn}`:""}${out?`<h3>Lanjut ke</h3>${out}`:""}</div>`;
}
nodes.forEach(n=>{
  n.setAttribute("tabindex","0");
  n.setAttribute("role","button");
  n.setAttribute("aria-label",INFO[n.id][0]+". "+INFO[n.id][1]);
  n.addEventListener("mouseenter",()=>show(n));
  n.addEventListener("mouseleave",()=>pinned?show(pinned):clear());
  n.addEventListener("focus",()=>show(n));
  n.addEventListener("blur",()=>pinned?show(pinned):clear());
  n.addEventListener("click",ev=>{ev.stopPropagation();pinned=pinned===n?null:n;pinned?show(n):clear();});
});
document.addEventListener("click",()=>{pinned=null;clear();});
clear();
</script>
